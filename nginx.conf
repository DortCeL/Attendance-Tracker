server {
  listen 80;
  root /usr/share/nginx/html;

  gzip on;
  gzip_min_length 1024;
  gzip_types application/javascript text/css application/json application/manifest+json image/svg+xml;

  # Self-hosted OCR engine (several MB). Missing files must 404, not fall back to index.html.
  location /ocr/ {
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }

  # Hashed build output can be cached forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # The service worker and app shell must always be revalidated so updates roll out.
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
